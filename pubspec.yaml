name: requests_inspector
description: A Flutter package for logging REST-APIs and GraphQL requests and
  accessing it by Shaking your phone to get the RequestsInspector widget on your
  screen.
version: 5.2.1
homepage: https://github.com/Abdelazeem777/requests_inspector
# we can add screenshots here using screenshots key
# please check this link https://dart.dev/tools/pub/pubspec#screenshots

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  collection: ^1.19.1
  connectivity_plus: ^7.0.0
  dio: ^5.9.0
  flutter:
    sdk: flutter
  gql: ^1.0.1
  graphql: ^5.2.3
  graphql_flutter:
    git:
      url: https://github.com/zino-hofmann/graphql-flutter
      path: packages/graphql_flutter
  provider: ^6.1.5+1
  sensors_plus: ^7.0.0
  share_plus: ^12.0.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
